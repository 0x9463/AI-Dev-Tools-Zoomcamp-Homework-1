{% extends "chores/base.html" %}
{% block title %}Sign in · Household chores{% endblock %}
{% block content %}
<h1 class="h3">Welcome back</h1>
<p class="text-secondary">Sign in to your household.</p>
<form method="post">
  {% csrf_token %}
  {% include "chores/fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary" type="submit">Sign in</button>
</form>
<p class="text-secondary mt-3 mb-0">New members join using an invitation from their household administrator.</p>
{% endblock %}
